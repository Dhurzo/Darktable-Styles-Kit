<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="dtstylekit logo">
  <defs>
    <linearGradient id="grade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="798" height="198" rx="28" fill="#141417" stroke="#2a2a30" stroke-width="2"/>

  <circle cx="105" cy="100" r="64" fill="url(#grade)"/>
  <circle cx="105" cy="100" r="64" fill="none" stroke="#00000022" stroke-width="2"/>
  <text x="105" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" fill="#16161a" letter-spacing="-1">dt</text>

  <text x="205" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#amber)">dt</tspan><tspan fill="#e5e7eb">stylekit</tspan>
  </text>
  <text x="208" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="500" fill="#9ca3af">AI color grading for darktable</text>

  <rect x="650" y="26" width="116" height="38" rx="19" fill="url(#amber)"/>
  <text x="708" y="46" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="800" fill="#16161a" letter-spacing="1">BETA</text>
</svg>
