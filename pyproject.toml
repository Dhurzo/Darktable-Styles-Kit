[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtstylekit"
version = "0.3.0"
description = "AI-Powered Darktable Style Generator using Vision Language Models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "dtstylekit contributors", email = "dtstylekit@users.noreply.github.com"}
]
keywords = ["darktable", "photography", "style", "preset", "vlm", "ollama", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "exifread>=3.0.0",
    "ollama>=0.3.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
dtstylekit = "dtstylekit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/Dhurzo/dtstylekit"
Repository = "https://github.com/Dhurzo/dtstylekit"
Issues = "https://github.com/Dhurzo/dtstylekit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtstylekit*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "requires_darktable: marks tests that require darktable binary",
    "requires_ollama: marks tests that require ollama running",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults
    "C408",  # unnecessary comprehension
]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
# 3.12 because numpy>=2.5 ships PEP 695 `type` statements in its stubs,
# which mypy cannot parse with a 3.11 target (even though the package
# itself supports Python >=3.11).
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "sentence_transformers.*",
    "ollama.*",
]
ignore_missing_imports = true
